<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Draft Room — WC Fantasy 2026</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="{ navOpen: false }" @keydown.escape.window="navOpen = false">
  <div class="app-wrapper">

    <!-- Nav -->
    <nav class="nav">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">⚽</span>
        <span class="brand-text">WC <span>Fantasy</span></span>
      </a>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="spinner" x-show="$store.auth.authLoading" x-cloak></div>
        <div class="nav-avatar" x-cloak
             x-show="!$store.auth.authLoading && $store.auth.isLoggedIn"
             :class="'avatar-' + $store.auth.user?.colorIdx"
             x-text="$store.auth.user?.initials"></div>
        <button class="nav-hamburger" @click="navOpen = !navOpen" aria-label="Menu">
          <span x-text="navOpen ? '✕' : '☰'"></span>
        </button>
      </div>
    </nav>
    <div x-show="navOpen" x-cloak @click="navOpen = false"
         style="position:fixed;inset:0;z-index:150"></div>
    <div class="nav-drawer" x-show="navOpen" x-cloak>
      <a href="index.html" class="nav-drawer-link">Standings</a>
      <a href="draft.html" class="nav-drawer-link active" x-show="$store.auth.isLoggedIn">Draft</a>
      <a href="teams.html" class="nav-drawer-link" x-show="$store.auth.isLoggedIn">Teams</a>
      <a href="my-team.html" class="nav-drawer-link" x-show="$store.auth.isLoggedIn">My Team</a>
      <a href="admin.html" class="nav-drawer-link" x-show="$store.auth.isAdmin">Admin</a>
      <div class="nav-drawer-divider"></div>
      <a href="login.html" class="nav-drawer-link" x-show="!$store.auth.isLoggedIn && !$store.auth.authLoading">Sign In</a>
      <button class="nav-drawer-link nav-drawer-signout" x-show="$store.auth.isLoggedIn" @click="signOutUser()">Sign Out</button>
    </div>

    <!-- Draft Room -->
    <main class="page-content" x-data="draftPage()">

      <!-- Round / Pick / Timer header -->
      <div class="pick-header" style="margin-bottom:12px;position:sticky;top:var(--nav-height);z-index:10;background:var(--color-bg);padding-top:8px;margin-top:-8px">
        <div>
          <div class="pick-header-label">Round</div>
          <div class="pick-header-value" x-text="round"></div>
        </div>
        <div style="text-align:center">
          <div class="pick-header-label">Pick</div>
          <div class="pick-header-value" x-text="pickOverall"></div>
        </div>
        <div style="text-align:right">
          <div class="pick-header-label">Time left</div>
          <div class="timer"
               :class="draftStatus !== 'active' ? '' : timerSeconds > 30 ? 'timer-green' : timerSeconds > 10 ? 'timer-yellow' : 'timer-red'"
               x-text="draftStatus === 'active' ? timerDisplay : draftStatus === 'complete' ? 'Done' : '—'"></div>
        </div>
      </div>

      <!-- Turn banner -->
      <div class="turn-banner" :class="isMyTurn ? 'your-turn' : ''" style="margin-bottom:12px">
        <div class="avatar avatar-sm"
             :class="'avatar-' + currentPicker.colorIdx"
             x-text="currentPicker.initials"></div>
        <div>
          <div class="turn-label" x-text="turnLabel"></div>
          <div class="turn-name" x-text="turnSubLabel"></div>
        </div>
      </div>

      <!-- My roster progress -->
      <div class="card" style="margin-bottom:16px">
        <div class="section-label" style="margin-bottom:8px">My Roster (<span x-text="myPicks.length"></span>/11)</div>
        <div class="roster-slots">
          <template x-for="slot in rosterSlots" :key="slot.key">
            <div class="roster-slot" :class="slot.player ? 'filled' : ''">
              <div class="roster-slot-pos" x-text="slot.label"></div>
              <div class="roster-slot-name" x-text="slot.player ? slot.player.split(' ').pop() : '—'"></div>
            </div>
          </template>
        </div>
      </div>

      <!-- Draft history -->
      <div style="margin-bottom:16px">
        <div class="section-label" style="margin-bottom:8px">Draft History</div>
        <template x-if="history.length === 0">
          <div class="card" style="padding:16px;color:var(--color-text-muted);font-size:var(--text-sm);text-align:center">
            No picks yet — draft hasn't started
          </div>
        </template>
        <div class="card" x-show="history.length > 0"
             style="padding:0;overflow:hidden;max-height:320px;overflow-y:auto"
             x-ref="historyList">
          <template x-for="entry in history" :key="entry.pick">
            <div class="pick-log-item">
              <div class="pick-number" x-text="entry.pick"></div>
              <div class="pick-detail">
                <div class="pick-player-name" x-text="entry.player"></div>
                <div class="pick-owner">
                  <span :class="'badge badge-' + entry.pos.toLowerCase()" x-text="entry.pos"></span>
                  &nbsp;→&nbsp;
                  <span x-text="entry.name"></span>
                  <span style="color:var(--color-text-dim)"> · R<span x-text="entry.round"></span></span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- AI Suggestions (only visible on your turn) -->
      <div class="card" style="margin-bottom:16px" x-show="isMyTurn">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="section-label">Suggested Picks</div>
          <button class="btn btn-secondary btn-sm"
                  :disabled="suggestLoading"
                  @click="askClaude()"
                  x-text="suggestLoading ? 'Thinking…' : suggestions.length ? 'Refresh' : 'Ask AI'"></button>
        </div>
        <div x-show="suggestLoading" style="display:flex;gap:8px;align-items:center;padding:4px 0">
          <div class="spinner"></div>
          <span style="font-size:var(--text-sm);color:var(--color-text-muted)">Getting suggestions…</span>
        </div>
        <template x-for="(s, idx) in suggestions" :key="idx">
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--color-border)">
            <div style="font-size:var(--text-xs);color:var(--color-text-muted);width:18px;flex-shrink:0;font-weight:600" x-text="(idx+1) + '.'"></div>
            <div style="font-size:var(--text-sm);font-weight:600" x-text="s"></div>
          </div>
        </template>
        <div x-show="suggestReasoning && suggestions.length"
             style="margin-top:10px;font-size:var(--text-xs);color:var(--color-text-muted);white-space:pre-line;line-height:1.5"
             x-text="suggestReasoning"></div>
      </div>

      <!-- Search + position filter -->
      <div style="margin-bottom:8px">
        <input class="form-input"
               type="search"
               placeholder="Search players…"
               x-model="search"
               style="margin-bottom:8px">
        <select class="form-input" x-model="nationFilter" style="margin-bottom:8px">
          <option value="ALL">All nations</option>
          <template x-for="nation in nations" :key="nation">
            <option :value="nation" x-text="nation"></option>
          </template>
        </select>
        <div class="tabs">
          <template x-for="tab in ['ALL','GK','DEF','MID','FWD']" :key="tab">
            <button class="tab-btn"
                    :class="posFilter === tab ? 'active' : ''"
                    @click="posFilter = tab"
                    x-text="tab"></button>
          </template>
        </div>
      </div>

      <!-- Available player count -->
      <div style="color:var(--color-text-muted);font-size:var(--text-xs);margin-bottom:8px">
        <span x-text="filteredPlayers.length"></span> available
      </div>

      <!-- Player list -->
      <div x-ref="playerList" @scroll="loadMoreOnScroll($event)"
           style="max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <template x-if="playersLoading">
          <div class="empty-state" style="padding:32px 16px">
            <div class="spinner"></div>
          </div>
        </template>

        <template x-if="!playersLoading && filteredPlayers.length === 0">
          <div class="empty-state" style="padding:32px 16px">
            <div class="empty-state-icon" style="font-size:32px">🔍</div>
            <div class="empty-state-text">No players match your search</div>
          </div>
        </template>

        <template x-for="player in visiblePlayers" :key="player.id">
          <div class="draft-player-card">
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:var(--text-sm)" x-text="player.name"></div>
              <div class="player-meta" style="margin-top:2px">
                <span x-text="player.country"></span>
                <span>·</span>
                <span :class="'badge badge-' + playerPos(player).toLowerCase()"
                      x-text="playerPos(player)"></span>
                <span x-show="player.clubTeam">·</span>
                <span x-show="player.clubTeam" x-text="player.clubTeam"></span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
              <div style="font-size:var(--text-xs);color:var(--color-text-muted)">
                ★ <span x-text="player.rating"></span>
              </div>
              <button class="btn btn-sm"
                      :class="isMyTurn ? 'btn-primary' : 'btn-secondary'"
                      :disabled="!isMyTurn || submitting"
                      @click="draftPlayer(player)"
                      x-text="submitting && pendingPickId === player.id ? '…' : isMyTurn ? 'Draft' : 'Wait'"></button>
            </div>
          </div>
        </template>

        <!-- Lazy-load hint: shown while more players remain below the fold. -->
        <div x-show="!playersLoading && visiblePlayers.length < filteredPlayers.length"
             style="text-align:center;padding:10px;color:var(--color-text-muted);font-size:var(--text-xs)">
          Scroll for more…
        </div>
      </div>

      <!-- Toast -->
      <div class="toast"
           x-show="toast"
           x-transition
           style="display:none"
           x-text="toastMsg"></div>

    </main>
  </div>

  <script>
    function draftPage() {
      return {
        // --- Draft state (kept in sync by Firestore listeners) ---
        draftStatus:      'pending',
        round:            1,
        pickOverall:      0,
        pickOrder:        [],      // UIDs in snake-draft round-1 order
        currentPickerUID: null,
        pickDeadline:     null,    // JS Date | null
        timerSeconds:     0,

        // --- Players ---
        allPlayers:       [],      // all players from API (including already-drafted)
        allPlayersById:   {},      // id → player (for position lookups in history)
        draftedPlayerIds: [],      // playerIds confirmed picked via Firestore
        playersLoading:   true,

        // --- Filters ---
        posFilter:    'ALL',
        nationFilter: 'ALL',
        search:       '',

        // --- Lazy rendering (only render renderLimit cards; grow on scroll) ---
        renderLimit: 40,
        renderStep:  40,

        // --- History (from Firestore picks sub-collection) ---
        history: [],

        // --- Users map (uid → { displayName, teamName, colorIdx }) ---
        users: {},

        // --- AI Suggestions ---
        suggestions:     [],
        suggestLoading:  false,
        suggestReasoning: '',

        // --- Submit state ---
        submitting:   false,
        pendingPickId: null,

        // --- Toast ---
        toast:    false,
        toastMsg: '',

        // --- Cleanup references ---
        _configUnsub:  null,
        _picksUnsub:   null,
        _timerInterval: null,

        // -------------------------------------------------------
        // Lifecycle
        // -------------------------------------------------------

        async init() {
          // Connect Firestore to the local emulator when running on localhost.
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            try { firebase.firestore().useEmulator('127.0.0.1', 8080); } catch {}
          }

          this.$watch('$store.auth.authLoading', v => { if (!v) this.loadAll(); });
          if (!Alpine.store('auth').authLoading) this.loadAll();

          // Reset the lazy-render window whenever a filter changes, and scroll
          // the list back to the top.
          ['search', 'posFilter', 'nationFilter'].forEach(f =>
            this.$watch(f, () => {
              this.renderLimit = this.renderStep;
              if (this.$refs.playerList) this.$refs.playerList.scrollTop = 0;
            }));
        },

        destroy() {
          if (this._configUnsub)  this._configUnsub();
          if (this._picksUnsub)   this._picksUnsub();
          if (this._timerInterval) clearInterval(this._timerInterval);
        },

        // -------------------------------------------------------
        // Data loading
        // -------------------------------------------------------

        async loadAll() {
          // Load reference data before starting Firestore listeners so position
          // lookups work immediately when the first snapshot fires.
          await Promise.all([this.loadUsers(), this.loadPlayers()]);
          this.startListeners();
          this.startTimer();
        },

        async loadUsers() {
          try {
            const res = await Api.getUsers();
            const map = {};
            (res.users || []).forEach((u, idx) => {
              const name = u.displayName || u.teamName || ('Player ' + (idx + 1));
              map[u.uid] = {
                displayName: name,
                teamName:    u.teamName,
                colorIdx:    idx % 8,
              };
            });
            this.users = map;
          } catch (e) {
            console.warn('[draft] loadUsers failed:', e);
          }
        },

        async loadPlayers() {
          this.playersLoading = true;
          try {
            const all = await Api.getPlayers();
            // Keep ALL players (including drafted) so we can look up positions for history.
            this.allPlayers = all;
            const byId = {};
            all.forEach(p => { byId[p.id] = p; });
            this.allPlayersById = byId;
          } catch {
            this.allPlayers = MOCK_AVAILABLE_PLAYERS;
            const byId = {};
            MOCK_AVAILABLE_PLAYERS.forEach(p => { byId[p.id] = p; });
            this.allPlayersById = byId;
          } finally {
            this.playersLoading = false;
          }
        },

        // -------------------------------------------------------
        // Firestore real-time listeners
        // -------------------------------------------------------

        startListeners() {
          const db = firebase.firestore();

          // --- Draft config ---
          this._configUnsub = db.collection('draft').doc('config')
            .onSnapshot(snap => {
              if (!snap.exists) return;
              const d = snap.data();
              this.draftStatus      = d.status || 'pending';
              this.round            = d.round  || 1;
              this.pickOverall      = (d.currentPickIndex || 0) + 1;
              this.pickOrder        = d.pickOrder || [];
              this.currentPickerUID = this.computePickerUID(d);
              this.pickDeadline     = d.currentPickDeadline?.toDate?.() || null;
            }, err => console.error('[draft] config listener:', err));

          // --- Picks (history + drafted id tracking) ---
          this._picksUnsub = db.collection('draft').doc('picks').collection('items')
            .orderBy('pickNumber')
            .onSnapshot(snap => {
              const draftedIds = [];
              const hist       = [];

              snap.forEach(doc => {
                const pick   = doc.data();
                const user   = this.users[pick.userId] || {};
                const player = this.allPlayersById[pick.playerId] || {};

                draftedIds.push(pick.playerId);
                hist.push({
                  pick:     pick.pickNumber,
                  round:    pick.round,
                  player:   pick.playerName,
                  playerId: pick.playerId,
                  pos:      player.position || player.pos || '?',
                  name:     user.displayName || pick.userId,
                  userId:   pick.userId,
                });
              });

              this.draftedPlayerIds = draftedIds;
              this.history          = hist;

              // Auto-scroll history list to the latest pick.
              this.$nextTick(() => {
                const el = this.$refs.historyList;
                if (el) el.scrollTop = el.scrollHeight;
              });
            }, err => console.error('[draft] picks listener:', err));
        },

        // -------------------------------------------------------
        // Countdown timer
        // -------------------------------------------------------

        startTimer() {
          if (this._timerInterval) clearInterval(this._timerInterval);
          this._timerInterval = setInterval(() => {
            if (!this.pickDeadline) { this.timerSeconds = 0; return; }
            this.timerSeconds = Math.max(0, Math.round((this.pickDeadline.getTime() - Date.now()) / 1000));
          }, 1000);
        },

        // -------------------------------------------------------
        // Computed helpers
        // -------------------------------------------------------

        // Mirror of Go models.DraftConfig.CurrentPickerUID()
        computePickerUID(config) {
          const order = config.pickOrder || [];
          const n = order.length;
          if (!n) return null;
          const i     = config.currentPickIndex || 0;
          const round = Math.floor(i / n);
          const pos   = i % n;
          return round % 2 === 0 ? order[pos] : order[n - 1 - pos];
        },

        playerPos(player) {
          return player.pos || player.position || '?';
        },

        get isMyTurn() {
          const uid = Alpine.store('auth').user?.uid;
          return this.draftStatus === 'active' && !!uid && this.currentPickerUID === uid;
        },

        get timerDisplay() {
          const s = this.timerSeconds;
          return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        },

        get turnLabel() {
          if (this.draftStatus === 'pending')  return 'Draft pending';
          if (this.draftStatus === 'paused')   return 'Draft paused';
          if (this.draftStatus === 'complete') return 'Draft complete';
          return this.isMyTurn ? '🟢 Your turn!' : 'Now picking';
        },

        get turnSubLabel() {
          if (this.draftStatus !== 'active') return this.draftStatus === 'pending' ? 'Waiting for admin to start' : '';
          return this.isMyTurn ? 'Make your pick' : (this.currentPicker.displayName + ' is on the clock');
        },

        get currentPicker() {
          const user = this.users[this.currentPickerUID] || {};
          const name = user.displayName || '—';
          const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
          return { displayName: name, initials, colorIdx: user.colorIdx ?? 0 };
        },

        get myPicks() {
          const uid = Alpine.store('auth').user?.uid;
          return uid ? this.history.filter(h => h.userId === uid) : [];
        },

        get rosterSlots() {
          const slots = [];
          const add = (pos, count) => {
            const filled = this.myPicks.filter(h => h.pos === pos).map(h => h.player);
            for (let i = 0; i < count; i++) {
              slots.push({ key: pos + i, label: pos, player: filled[i] || null });
            }
          };
          add('GK', 1); add('DEF', 4); add('MID', 4); add('FWD', 2);
          return slots;
        },

        get nations() {
          return [...new Set(this.allPlayers.map(p => p.country).filter(Boolean))]
            .sort((a, b) => a.localeCompare(b));
        },

        get filteredPlayers() {
          const draftedSet = new Set(this.draftedPlayerIds);
          return this.allPlayers.filter(p => {
            // Exclude already-drafted (from API flag) or confirmed via Firestore
            if (p.drafted || draftedSet.has(p.id)) return false;
            // Position filter
            const pos = this.playerPos(p);
            if (this.posFilter !== 'ALL' && pos !== this.posFilter) return false;
            // Nation filter
            if (this.nationFilter !== 'ALL' && p.country !== this.nationFilter) return false;
            // Search filter
            const q = this.search.toLowerCase();
            if (q && !p.name.toLowerCase().includes(q) && !(p.country || '').toLowerCase().includes(q)) return false;
            return true;
          })
          // Highest-rated players first.
          .sort((a, b) => (b.rating || 0) - (a.rating || 0));
        },

        // Only the first renderLimit players are rendered; grows on scroll.
        get visiblePlayers() {
          return this.filteredPlayers.slice(0, this.renderLimit);
        },

        // Grow the render window as the user nears the bottom of the list.
        loadMoreOnScroll(e) {
          const el = e.target;
          if (el.scrollHeight - el.scrollTop - el.clientHeight < 240 &&
              this.renderLimit < this.filteredPlayers.length) {
            this.renderLimit += this.renderStep;
          }
        },

        // -------------------------------------------------------
        // Actions
        // -------------------------------------------------------

        async draftPlayer(player) {
          if (!this.isMyTurn || this.submitting) return;
          this.submitting   = true;
          this.pendingPickId = player.id;
          try {
            await Api.submitPick(player.id);
            this.showToast('Picked ' + player.name + '!');
            // Clear suggestions — Firestore listener handles roster/history updates
            this.suggestions     = [];
            this.suggestReasoning = '';
          } catch (e) {
            this.showToast('Error: ' + (e.message || 'pick failed'));
          } finally {
            this.submitting   = false;
            this.pendingPickId = null;
          }
        },

        async askClaude() {
          if (this.suggestLoading) return;
          this.suggestLoading  = true;
          this.suggestions     = [];
          this.suggestReasoning = '';
          try {
            const myRoster = this.myPicks.map(h => ({ name: h.player, position: h.pos }));
            const available = this.filteredPlayers.slice(0, 50).map(p => ({
              id:       p.id,
              name:     p.name,
              position: this.playerPos(p),
              rating:   p.rating || 80,
              country:  p.country || '',
            }));
            const res = await Api.getDraftSuggestions(myRoster, available);
            this.suggestions      = res.suggestions || [];
            this.suggestReasoning = res.reasoning   || '';
          } catch (e) {
            this.showToast('Suggestion failed: ' + (e.message || 'try again'));
          } finally {
            this.suggestLoading = false;
          }
        },

        showToast(msg) {
          this.toastMsg = msg;
          this.toast    = true;
          setTimeout(() => { this.toast = false; }, 2500);
        },
      };
    }
  </script>
</body>
</html>
