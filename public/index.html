<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Standings — WC Fantasy 2026</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
  <div class="app-wrapper">

    <!-- Nav -->
    <nav class="nav">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">⚽</span>
        <span class="brand-text">WC <span>Fantasy</span></span>
      </a>
      <div class="nav-actions" x-data>
        <div class="spinner" x-show="$store.auth.authLoading"></div>
        <a href="login.html" class="nav-link" x-show="!$store.auth.authLoading && !$store.auth.isLoggedIn" x-cloak>Sign In</a>
        <div x-show="!$store.auth.authLoading && $store.auth.isLoggedIn" x-cloak style="display:flex;align-items:center;gap:12px">
          <a href="draft.html" class="nav-link">Draft</a>
          <a href="my-team.html" class="nav-link">My Team</a>
          <a href="admin.html" class="nav-link" x-show="$store.auth.isAdmin">Admin</a>
          <div class="nav-avatar"
               :class="'avatar-' + $store.auth.user?.colorIdx"
               x-text="$store.auth.user?.initials"></div>
        </div>
      </div>
    </nav>

    <!-- Leaderboard -->
    <main class="page-content" x-data="leaderboardPage()" x-init="load()">

      <div class="page-header">
        <h1 class="page-title">Standings</h1>
        <p class="page-subtitle">World Cup 2026 Fantasy · Group Stage</p>
      </div>

      <!-- Loading skeletons -->
      <template x-if="loading">
        <div>
          <template x-for="i in [1,2,3,4,5,6,7,8]" :key="i">
            <div class="leaderboard-card" style="pointer-events:none;margin-bottom:8px">
              <div class="skeleton" style="width:28px;height:28px;border-radius:50%"></div>
              <div class="skeleton" style="width:44px;height:44px;border-radius:50%"></div>
              <div style="flex:1;display:flex;flex-direction:column;gap:6px">
                <div class="skeleton" style="height:14px;width:60%"></div>
                <div class="skeleton" style="height:12px;width:40%"></div>
              </div>
              <div class="skeleton" style="width:40px;height:32px;border-radius:8px"></div>
            </div>
          </template>
        </div>
      </template>

      <!-- Error state -->
      <div x-show="error && !loading" class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div class="empty-state-text" x-text="error"></div>
        <button class="btn btn-secondary" style="margin-top:16px" @click="load()">Retry</button>
      </div>

      <!-- Empty state -->
      <template x-if="!loading && !error && standings.length === 0">
        <div class="empty-state">
          <div class="empty-state-icon">🏆</div>
          <div class="empty-state-text">No standings yet — draft coming soon!</div>
        </div>
      </template>

      <!-- Standings list -->
      <template x-if="!loading && !error && standings.length > 0">
        <div>
          <template x-for="(entry, i) in standings" :key="entry.userId">
            <a :href="'team.html?id=' + entry.userId"
               class="leaderboard-card"
               :class="i === 0 ? 'rank-1-card' : ''">

              <div class="rank-badge"
                   :class="i < 3 ? 'rank-' + (i + 1) : ''"
                   x-text="i + 1"></div>

              <template x-if="entry.photoURL">
                <div class="avatar">
                  <img :src="entry.photoURL" :alt="entry.displayName">
                </div>
              </template>
              <template x-if="!entry.photoURL">
                <div class="avatar" :class="'avatar-' + (i % 8)" x-text="initials(entry.displayName)"></div>
              </template>

              <div class="lb-info">
                <div class="lb-team-name" x-text="entry.teamName"></div>
                <div class="lb-owner" x-text="entry.displayName"></div>
              </div>

              <div class="lb-points">
                <div class="lb-points-value" x-text="entry.totalPoints"></div>
                <div class="lb-points-label">pts</div>
              </div>

            </a>
          </template>
        </div>
      </template>

      <!-- Last updated -->
      <p x-show="lastUpdated" style="text-align:center;color:var(--color-text-dim);font-size:var(--text-xs);margin-top:16px">
        Updated <span x-text="lastUpdated"></span>
      </p>

    </main>
  </div>

  <script>
    function leaderboardPage() {
      return {
        standings: [],
        loading: true,
        error: null,
        lastUpdated: null,
        _refreshTimer: null,

        async load() {
          this.loading = true;
          this.error = null;
          try {
            const data = await Api.getLeaderboard();
            this.standings = data.standings || [];
            this.lastUpdated = new Date().toLocaleTimeString();
          } catch (e) {
            this.error = 'Could not load standings. Is the API running?';
          } finally {
            this.loading = false;
          }
        },

        initAutoRefresh() {
          // Refresh every 60 seconds.
          this._refreshTimer = setInterval(() => this.load(), 60_000);
        },

        destroy() {
          clearInterval(this._refreshTimer);
        },

        initFull() {
          this.load();
          this.initAutoRefresh();
        },

        initAll() {
          this.$nextTick(() => this.initFull());
        },

        initMethod() {
          this.load();
          this.initAutoRefresh();
        },

        initPage() {
          this.load();
          setInterval(() => this.load(), 60_000);
        },

        initials(name) {
          if (!name) return '?';
          return name.trim().split(/\s+/).map(n => n[0]).join('').slice(0, 2).toUpperCase();
        },
      };
    }
  </script>
</body>
</html>
