<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Team — WC Fantasy 2026</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="{ navOpen: false }" @keydown.escape.window="navOpen = false">
  <div class="app-wrapper">

    <!-- Nav -->
    <nav class="nav">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">⚽</span>
        <span class="brand-text">WC <span>Fantasy</span></span>
      </a>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="spinner" x-show="$store.auth.authLoading" x-cloak></div>
        <div class="nav-avatar" x-cloak
             x-show="!$store.auth.authLoading && $store.auth.isLoggedIn"
             :class="'avatar-' + $store.auth.user?.colorIdx"
             x-text="$store.auth.user?.initials"></div>
        <button class="nav-hamburger" @click="navOpen = !navOpen" aria-label="Menu">
          <span x-text="navOpen ? '✕' : '☰'"></span>
        </button>
      </div>
    </nav>
    <div x-show="navOpen" x-cloak @click="navOpen = false"
         style="position:fixed;inset:0;z-index:150"></div>
    <div class="nav-drawer" x-show="navOpen" x-cloak>
      <a href="index.html" class="nav-drawer-link">Standings</a>
      <a href="draft.html" class="nav-drawer-link" x-show="$store.auth.isLoggedIn">Draft</a>
      <a href="teams.html" class="nav-drawer-link" x-show="$store.auth.isLoggedIn">Teams</a>
      <a href="my-team.html" class="nav-drawer-link" x-show="$store.auth.isLoggedIn">My Team</a>
      <a href="admin.html" class="nav-drawer-link" x-show="$store.auth.isAdmin">Admin</a>
      <div class="nav-drawer-divider"></div>
      <a href="login.html" class="nav-drawer-link" x-show="!$store.auth.isLoggedIn && !$store.auth.authLoading">Sign In</a>
      <button class="nav-drawer-link nav-drawer-signout" x-show="$store.auth.isLoggedIn" @click="signOutUser()">Sign Out</button>
    </div>

    <!-- Team view -->
    <main class="page-content" x-data="teamPage()" x-init="load()">

      <!-- Loading -->
      <template x-if="loading">
        <div>
          <div class="team-header-card">
            <div class="skeleton" style="width:56px;height:56px;border-radius:50%;margin:0 auto"></div>
            <div class="skeleton" style="width:80px;height:48px;margin:12px auto 4px;border-radius:8px"></div>
            <div class="skeleton" style="width:120px;height:14px;margin:0 auto 12px;border-radius:6px"></div>
            <div class="skeleton" style="width:160px;height:18px;margin:0 auto 4px;border-radius:6px"></div>
            <div class="skeleton" style="width:100px;height:13px;margin:0 auto;border-radius:6px"></div>
          </div>
          <template x-for="i in [1,2,3,4,5]" :key="i">
            <div class="player-card" style="margin-bottom:8px">
              <div style="flex:1;display:flex;flex-direction:column;gap:6px">
                <div class="skeleton" style="height:13px;width:55%"></div>
                <div class="skeleton" style="height:11px;width:35%"></div>
              </div>
              <div class="skeleton" style="width:32px;height:16px;border-radius:6px"></div>
            </div>
          </template>
        </div>
      </template>

      <!-- Not found -->
      <template x-if="!loading && notFound">
        <div class="empty-state">
          <div class="empty-state-icon">🔍</div>
          <div class="empty-state-text">Team not found</div>
          <a href="index.html" class="btn btn-secondary" style="margin-top:16px">← Standings</a>
        </div>
      </template>

      <!-- Team content -->
      <template x-if="!loading && !notFound && team">
        <div>
          <div class="team-header-card">
            <template x-if="team.photoURL">
              <div class="avatar avatar-lg" style="margin:0 auto"><img :src="team.photoURL"></div>
            </template>
            <template x-if="!team.photoURL">
              <div class="avatar avatar-lg" style="margin:0 auto;background:var(--color-primary);color:white"
                   x-text="initials(team.displayName || team.teamName)"></div>
            </template>
            <div class="team-total-points" x-text="team.totalPoints"></div>
            <div class="team-total-label">total points</div>
            <div style="margin-top:12px">
              <div style="font-size:var(--text-lg);font-weight:800" x-text="team.teamName"></div>
              <div style="color:var(--color-text-muted);font-size:var(--text-sm);margin-top:2px" x-text="team.userId"></div>
            </div>
          </div>

          <template x-for="group in positionGroups" :key="group.pos">
            <div class="position-group" x-show="group.players.length">
              <div class="position-group-header">
                <span class="badge" :class="'badge-' + group.pos.toLowerCase()" x-text="group.pos"></span>
                <span class="position-group-title" x-text="group.label"></span>
              </div>
              <template x-for="p in group.players" :key="p.playerId">
                <div x-data="{ open: false }">
                  <div class="player-card" style="cursor:pointer" @click="open = !open">
                    <div style="flex:1">
                      <div class="player-name" x-text="p.name"></div>
                      <div class="player-meta"><span x-text="p.country"></span></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px">
                      <div class="player-points" x-text="'+' + (p.totalPoints || 0)"></div>
                      <span style="color:var(--color-text-muted);font-size:10px;transition:transform 0.15s"
                            :style="open ? 'transform:rotate(180deg)' : ''">▼</span>
                    </div>
                  </div>
                  <div x-show="open" style="border:1px solid var(--color-border);border-top:none;border-radius:0 0 10px 10px;margin-bottom:6px;background:var(--color-surface)">
                    <template x-if="!p.matchStats || p.matchStats.length === 0">
                      <div style="padding:12px 14px;font-size:var(--text-sm);color:var(--color-text-muted)">No scored matches yet</div>
                    </template>
                    <template x-if="p.matchStats && p.matchStats.length > 0">
                      <div>
                        <template x-for="(m, idx) in p.matchStats" :key="m.matchId">
                          <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:var(--text-sm)"
                               :style="idx > 0 ? 'border-top:1px solid var(--color-border)' : ''">
                            <div style="color:var(--color-text-muted);min-width:60px" x-text="fmtDate(m.date)"></div>
                            <div style="flex:1;font-weight:500" x-text="'vs ' + (m.opponent || '?')"></div>
                            <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
                              <template x-if="m.goals > 0"><span class="badge-stat text-success" x-text="'G:' + m.goals"></span></template>
                              <template x-if="m.assists > 0"><span class="badge-stat text-success" x-text="'A:' + m.assists"></span></template>
                              <template x-if="m.cleanSheet"><span class="badge-stat text-success">CS</span></template>
                              <template x-if="m.teamWin"><span class="badge-stat text-success">W</span></template>
                              <template x-if="m.teamDraw && !m.teamWin"><span class="badge-stat" style="color:var(--color-text-muted)">D</span></template>
                              <template x-if="!m.teamWin && !m.teamDraw"><span class="badge-stat" style="color:var(--color-text-muted)">L</span></template>
                              <template x-if="m.yellowCards > 0"><span class="badge-stat text-warning" x-text="'Y:' + m.yellowCards"></span></template>
                              <template x-if="m.redCards > 0"><span class="badge-stat text-danger" x-text="'R:' + m.redCards"></span></template>
                            </div>
                            <div style="min-width:32px;text-align:right;font-weight:700"
                                 :class="m.pointsAwarded > 0 ? 'text-success' : m.pointsAwarded < 0 ? 'text-danger' : ''"
                                 x-text="(m.pointsAwarded > 0 ? '+' : '') + m.pointsAwarded"></div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <a href="index.html" class="btn btn-secondary btn-lg" style="margin-top:8px">← Back to Standings</a>
        </div>
      </template>

    </main>
  </div>

  <script>
    function teamPage() {
      return {
        team: null,
        loading: true,
        notFound: false,

        async load() {
          const uid = new URLSearchParams(window.location.search).get('id');
          if (!uid) { this.notFound = true; this.loading = false; return; }
          try {
            this.team = await Api.getTeam(uid);
            document.title = this.team.teamName + ' — WC Fantasy 2026';
          } catch (e) {
            this.notFound = true;
          } finally {
            this.loading = false;
          }
        },

        get positionGroups() {
          if (!this.team) return [];
          const players = this.team.players || [];
          return [
            { pos: 'GK',  label: 'Goalkeeper',  players: players.filter(p => p.position === 'GK')  },
            { pos: 'DEF', label: 'Defenders',    players: players.filter(p => p.position === 'DEF') },
            { pos: 'MID', label: 'Midfielders',  players: players.filter(p => p.position === 'MID') },
            { pos: 'FWD', label: 'Forwards',     players: players.filter(p => p.position === 'FWD') },
          ];
        },

        initials(name) {
          if (!name) return '?';
          return name.trim().split(/\s+/).map(n => n[0]).join('').slice(0, 2).toUpperCase();
        },

        fmtDate(iso) {
          if (!iso) return '';
          const d = new Date(iso);
          return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        },
      };
    }
  </script>
</body>
</html>
