<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In — WC Fantasy 2026</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="{ navOpen: false }" @keydown.escape.window="navOpen = false">
  <div class="app-wrapper">

    <!-- Nav -->
    <nav class="nav">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">⚽</span>
        <span class="brand-text">WC <span>Fantasy</span></span>
      </a>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="nav-hamburger" @click="navOpen = !navOpen" aria-label="Menu">
          <span x-text="navOpen ? '✕' : '☰'"></span>
        </button>
      </div>
    </nav>
    <div x-show="navOpen" x-cloak @click="navOpen = false"
         style="position:fixed;inset:0;z-index:150"></div>
    <div class="nav-drawer" x-show="navOpen" x-cloak>
      <a href="index.html" class="nav-drawer-link">Standings</a>
      <a href="login.html" class="nav-drawer-link active">Sign In</a>
    </div>

    <!-- Login card -->
    <main class="page-content"
          style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px)"
          x-data="loginPage()">

      <div style="width:100%">
        <div class="login-card">
          <div class="login-logo">⚽</div>
          <h1 class="login-title">WC Fantasy <span style="color:var(--color-accent)">2026</span></h1>
          <p class="login-tagline">
            Draft your squad. Track every goal.<br>Win the group.
          </p>

          <!-- Error message -->
          <div x-show="error"
               style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:12px;margin-bottom:16px;color:var(--color-danger);font-size:var(--text-sm)"
               x-text="error"></div>

          <!-- Google sign-in button -->
          <button class="btn-google" @click="signIn()" :disabled="busy">
            <template x-if="!busy">
              <svg class="google-icon" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
            </template>
            <div x-show="busy" class="spinner" style="border-top-color:#4285F4;border-color:rgba(0,0,0,0.15)"></div>
            <span x-text="busy ? 'Signing in…' : 'Continue with Google'"></span>
          </button>

          <div class="divider" style="margin:20px 0"></div>

          <p style="font-size:var(--text-xs);color:var(--color-text-dim);line-height:1.6">
            This is a private league for invited players only.<br>
            Sign in with the Google account you registered with.
          </p>
        </div>

        <!-- Already signed in notice -->
        <div x-show="$store.auth.isLoggedIn" style="text-align:center;margin-top:16px" x-cloak>
          <p style="color:var(--color-text-muted);font-size:var(--text-sm)">
            Signed in as <strong x-text="$store.auth.user?.displayName"></strong> ·
            <a href="index.html" style="color:var(--color-primary)">Go to standings</a>
          </p>
        </div>
      </div>

    </main>
  </div>

  <script>
    function loginPage() {
      return {
        busy: false,
        error: null,

        async signIn() {
          this.busy = true;
          this.error = null;
          try {
            await signInWithGoogle();
            // auth.js onAuthStateChanged will handle the redirect.
          } catch (e) {
            if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
              // User dismissed — not an error worth showing.
            } else if (e.code === 'auth/popup-blocked') {
              this.error = 'Popup was blocked. Please allow popups for this site.';
            } else {
              this.error = e.message || 'Sign-in failed. Please try again.';
            }
            this.busy = false;
          }
        },
      };
    }
  </script>
</body>
</html>
