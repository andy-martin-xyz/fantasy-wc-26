services:

  # Firebase Auth + Firestore emulators
  emulators:
    image: andreysenov/firebase-tools
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "9099:9099"   # Auth emulator
      - "8080:8080"   # Firestore emulator
      - "4000:4000"   # Emulator UI
    command: firebase emulators:start --only auth,firestore

  # Go API server
  api:
    image: golang:1.26-alpine
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIRESTORE_EMULATOR_HOST=emulators:8080
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - GOOGLE_APPLICATION_CREDENTIALS=/keys/fantasy-wc-sa.json
    volumes:
      - .:/app
      - /Users/andrewmartin/keys:/keys:ro
    working_dir: /app
    command: go run ./cmd/server
    depends_on:
      - emulators

  # One-shot seed: waits for emulators, then writes test players
  seed:
    image: golang:1.26-alpine
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIRESTORE_EMULATOR_HOST=emulators:8080
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "until nc -z emulators 8080; do sleep 1; done && go run ./cmd/seed"
    depends_on:
      - emulators
    restart: "no"

  # Static frontend (serves public/) — config.js generated at startup from .env
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    environment:
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID}
    volumes:
      - ./public:/usr/share/nginx/html
      - ./scripts/generate-config.sh:/docker-entrypoint.d/40-generate-config.sh:ro
