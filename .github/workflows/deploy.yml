# Deploys to production on every push to master (i.e. every PR merge).
#
# ── One-time setup required before this works ──────────────────────────────
# The workflow authenticates with a GCP service account key stored in the
# GitHub secret GCP_SA_KEY. To create it (run locally, once):
#
#   gcloud iam service-accounts create github-deployer \
#     --project andy-personal-1bb38 --display-name "GitHub Actions deployer"
#
#   for role in roles/run.admin roles/iam.serviceAccountUser \
#               roles/cloudbuild.builds.editor roles/storage.admin \
#               roles/artifactregistry.writer roles/serviceusage.serviceUsageConsumer \
#               roles/firebasehosting.admin roles/firebaserules.admin; do
#     gcloud projects add-iam-policy-binding andy-personal-1bb38 \
#       --member serviceAccount:github-deployer@andy-personal-1bb38.iam.gserviceaccount.com \
#       --role "$role" --condition None
#   done
#
#   gcloud iam service-accounts keys create /tmp/github-deployer.json \
#     --iam-account github-deployer@andy-personal-1bb38.iam.gserviceaccount.com
#   gh secret set GCP_SA_KEY < /tmp/github-deployer.json
#   rm /tmp/github-deployer.json
#
# (Keyless Workload Identity Federation is the better long-term option if this
# repo ever has more than one maintainer — happy to migrate later.)
# ────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [master]

# Never run two production deploys at once; queue instead of cancelling so a
# merge that lands mid-deploy still gets deployed.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Fast sanity gate only — full tests (with the Firestore emulator) run
      # in ci.yml on the PR before it can merge.
      - name: Build + vet
        run: |
          go build ./...
          go vet ./...

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy fantasy-league-api \
            --source . \
            --region us-central1 \
            --project andy-personal-1bb38 \
            --quiet

      # google-github-actions/auth exports GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools picks up automatically.
      - name: Deploy hosting + Firestore rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules \
            --project andy-personal-1bb38 --non-interactive
